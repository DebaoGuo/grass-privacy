<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="format-detection" content="telephone=no" />
<title>Grass · 我的小草</title>
<meta name="description" content="领养一棵属于你的小草：触摸它、用洒水壶浇灌它、看它慢慢长大。" />
<meta name="theme-color" content="#FFFFFF" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Grass" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
  :root{
    --blue:#007AFF;
    --ink:#1D1D1F;
    --sub:#8E8E93;
    --track:#E9E9ED;
    --card:rgba(242,242,247,.88);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Helvetica Neue",Helvetica,Arial,sans-serif;
    background:#F2F2F7;color:var(--ink);
    -webkit-font-smoothing:antialiased;
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
    overflow:hidden;overscroll-behavior:none;
    touch-action:manipulation;
  }
  #phone{
    position:relative;max-width:430px;height:100%;height:100dvh;margin:0 auto;
    background:#FFFFFF;
    display:flex;flex-direction:column;
    box-shadow:0 0 80px rgba(0,0,0,.10);
    overflow:hidden;
  }
  /* ---------- 标题 ---------- */
  header{
    padding:12px 24px 4px;
    padding-top:calc(constant(safe-area-inset-top) + 12px);
    padding-top:calc(env(safe-area-inset-top) + 12px);
    flex:none;
  }
  h1{font-size:34px;font-weight:800;letter-spacing:-.6px;line-height:1.1;display:inline-block;cursor:pointer;color:#111113}
  #subtitle{color:var(--sub);font-size:15px;margin-top:3px;letter-spacing:.2px}
  .header-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  #aboutbtn{border:none;background:none;color:var(--sub);font-size:15px;font-weight:500;cursor:pointer;padding:6px 2px;flex:none}
  .about-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f0f2;font-size:15px}
  .about-row span:first-child{color:var(--sub)}
  .about-link{display:block;text-align:center;color:var(--blue);font-size:15px;font-weight:600;padding:14px 0;text-decoration:none}
  /* ---------- 画布 ---------- */
  main{flex:1;position:relative;min-height:0}
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #scene:active{cursor:grabbing}
  #install{
    position:absolute;left:14px;right:14px;bottom:14px;z-index:6;
    background:rgba(255,255,255,.97);border:1px solid rgba(0,0,0,.06);
    border-radius:18px;padding:12px 14px;
    display:none;align-items:center;gap:10px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
    font-size:13px;line-height:1.45;
  }
  #install.show{display:flex;animation:rise .45s cubic-bezier(.2,.9,.3,1.2)}
  #install b{color:var(--blue)}
  #install .x{margin-left:auto;color:var(--sub);font-size:18px;padding:4px 6px;cursor:pointer}
  @keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
  /* ---------- 底部信息卡 ---------- */
  footer{
    padding:10px 16px 8px;
    padding-bottom:calc(constant(safe-area-inset-bottom) + 8px);
    padding-bottom:calc(env(safe-area-inset-bottom) + 8px);
    flex:none;
  }
  #controlcard{
    background:var(--card);
    -webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);
    border-radius:26px;padding:16px;
    display:flex;align-items:center;gap:14px;
    border:1px solid rgba(255,255,255,.6);
    box-shadow:0 8px 32px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.5);
  }
  .mid{flex:1;min-width:0}
  .statrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .statlabel{font-size:13px;color:var(--sub);font-weight:500}
  .statval{font-size:13px;font-weight:600}
  #healthbar{height:12px;border-radius:999px;background:var(--track);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.06)}
  #healthfill{
    height:100%;width:100%;border-radius:999px;
    background:linear-gradient(90deg,#4CAF50,#8BC34A);
    transition:width .5s cubic-bezier(.2,.8,.3,1),background .8s ease;
    box-shadow:inset 0 1px 2px rgba(255,255,255,.4);
  }
  .chiprow{display:flex;align-items:center;gap:8px;margin-top:10px;min-width:0}
  .chip{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgba(0,122,255,.12);color:var(--blue);white-space:nowrap}
  .chip.warn{background:rgba(255,149,0,.16);color:#E8880C}
  .chip.bad{background:rgba(255,59,48,.14);color:#FF3B30}
  .chip.good{background:rgba(52,199,89,.16);color:#34C759}
  #lastwater{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side{flex:none;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .kv{text-align:right}
  .kv .k{font-size:11px;color:var(--sub)}
  .kv .v{font-size:15px;font-weight:700;letter-spacing:-.2px}
  /* ---------- 启动画面 ---------- */
  #splash{
    position:fixed;inset:0;z-index:100;background:#FFFFFF;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:opacity .55s ease;
  }
  #splash.hide{opacity:0;pointer-events:none}
  .splash-logo{width:112px;height:112px;border-radius:26px;box-shadow:0 16px 40px rgba(0,0,0,.12);animation:splashIn .6s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes splashIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  #splash-name{font-size:30px;font-weight:800;margin-top:20px;letter-spacing:-.3px;animation:fadeUp .6s .1s both}
  #splash-brand{font-size:13px;color:var(--sub);margin-top:6px;letter-spacing:3px;animation:fadeUp .6s .2s both}
  @keyframes fadeUp{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  /* ---------- 隐私政策同意弹窗 ---------- */
  .privacy-overlay{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);padding:28px}
  .privacy-overlay.show{display:flex}
  .privacy-card{background:#fff;border-radius:16px;padding:24px 20px;max-width:340px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:rise .3s ease}
  .privacy-card-title{font-size:19px;font-weight:700;text-align:center;margin-bottom:14px}
  .privacy-card-text{font-size:14px;line-height:1.75;color:#2c2c2e;margin-bottom:20px}
  .privacy-card-text a{color:var(--blue);text-decoration:none}
  .privacy-card-btns{display:flex;gap:12px}
  .privacy-card-btns button{flex:1;padding:12px;border-radius:12px;font-size:16px;font-weight:600;border:none;cursor:pointer}
  .privacy-deny{background:#F2F2F7;color:var(--ink)}
  .privacy-agree{background:var(--blue);color:#fff}
  /* ---------- 弹层 ---------- */
  .overlay{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
  .overlay.show{display:flex}
  .sheet{width:88%;max-width:340px;background:#fff;border-radius:20px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:rise .3s cubic-bezier(.2,.9,.3,1.2)}
  .sheet h2{font-size:17px;font-weight:700;text-align:center;margin-bottom:16px}
  .sheet input{width:100%;border:none;background:#F2F2F7;border-radius:12px;padding:12px 14px;font-size:16px;outline:none;text-align:center;color:var(--ink)}
  .sheet-actions{display:flex;gap:10px;margin-top:16px}
  .sheet-actions button{flex:1;border:none;border-radius:12px;padding:12px;font-size:16px;font-weight:600;cursor:pointer}
  .btn-cancel{background:#F2F2F7;color:var(--ink)}
  .btn-primary{background:var(--blue);color:#fff}
  .opt-label{font-size:13px;color:var(--sub);margin:12px 0 8px;text-align:left}
  .color-grid{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .cswatch{width:40px;height:40px;border-radius:50%;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
  .cswatch.sel{border-color:var(--blue);box-shadow:0 0 0 2px rgba(0,122,255,.25)}
  .hex-row{display:flex;gap:8px;margin-top:2px}
  .hex-row input{flex:1}
  .hex-row button{flex:none;padding:0 16px;border:none;border-radius:12px;background:#F2F2F7;color:var(--ink);font-size:14px;font-weight:600;cursor:pointer}
  /* ---------- 洪水：隐藏顶栏底栏，让画布铺满全屏 ---------- */
  #phone.flooding header,#phone.flooding footer{display:none}
  @media (min-width:431px){
    body{display:flex;align-items:center;justify-content:center}
    #phone{height:min(900px,100dvh);border-radius:44px;margin:20px auto}
  }
</style>
</head>
<body>
<div id="phone">
  <header>
    <div class="header-row">
      <h1 id="title">小草</h1>
      <button id="aboutbtn">关于</button>
    </div>
    <div id="subtitle">Grass</div>
  </header>

  <main>
    <canvas id="scene"></canvas>
    <div id="install"><span>💡 想把它变成真正的 App？点右上角 <b>分享</b> → <b>添加到主屏幕</b></span><span class="x">✕</span></div>
  </main>

  <footer>
    <div id="controlcard">
      <div class="mid">
        <div class="statrow"><span class="statlabel">健康</span><span class="statval" id="healthnum">100%</span></div>
        <div id="healthbar"><div id="healthfill"></div></div>
        <div class="chiprow">
          <span class="chip good" id="statuschip">生机勃勃</span>
          <span id="lastwater">还没有浇过水</span>
        </div>
      </div>
      <div class="side">
        <div class="kv"><div class="k">陪伴</div><div class="v" id="daysval">1 天</div></div>
      </div>
    </div>
  </footer>
</div>

<div id="splash">
  <svg class="splash-logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <rect width="512" height="512" fill="#FFFFFF"/>
    <ellipse cx="256" cy="398" rx="150" ry="34" fill="#A6855D"/>
    <g stroke="#4C9A55" stroke-width="26" stroke-linecap="round" fill="none">
      <path d="M176 380 C160 300 190 250 160 150"/>
      <path d="M256 386 C250 300 260 240 258 120"/>
      <path d="M336 380 C352 300 322 250 352 150"/>
    </g>
    <g stroke="#7CC576" stroke-width="12" stroke-linecap="round" fill="none">
      <path d="M176 380 C150 330 165 290 150 240"/>
      <path d="M256 386 C240 320 252 285 242 220"/>
      <path d="M336 380 C362 330 347 290 362 240"/>
    </g>
    <circle cx="258" cy="96" r="14" fill="#FFD166"/>
  </svg>
  <div id="splash-name">小草</div>
  <div id="splash-brand">GRASS</div>
</div>

<!-- 隐私政策同意弹窗 -->
<div id="privacyoverlay" class="privacy-overlay">
  <div class="privacy-card">
    <div class="privacy-card-title">欢迎使用 Grass</div>
    <div class="privacy-card-text">
      我们非常重视你的个人信息和隐私。在使用前，请你仔细阅读并同意
      <a href="https://debaoguo.github.io/grass-privacy/user-agreement.html">《用户协议》</a> 和
      <a href="https://debaoguo.github.io/grass-privacy/">《隐私政策》</a>。
      如你同意，请点击"同意"开始使用。
    </div>
    <div class="privacy-card-btns">
      <button id="privacy-deny" class="privacy-deny">不同意</button>
      <button id="privacy-agree" class="privacy-agree">同意</button>
    </div>
  </div>
</div>

<div id="editor" class="overlay">
  <div class="sheet">
    <h2>给小草起个名字</h2>
    <input id="nameinput" maxlength="12" placeholder="小草" />
    <div class="sheet-actions">
      <button id="namecancel" class="btn-cancel">取消</button>
      <button id="namesave" class="btn-primary">保存</button>
    </div>
  </div>
</div>

<div id="coloroverlay" class="overlay">
  <div class="sheet">
    <h2>花盆颜色</h2>
    <div class="opt-label">预设颜色</div>
    <div class="color-grid">
      <button class="cswatch" id="color0" style="background:rgb(248,241,230)"></button>
      <button class="cswatch" id="color1" style="background:rgb(246,217,224)"></button>
      <button class="cswatch" id="color2" style="background:rgb(217,232,246)"></button>
      <button class="cswatch" id="color3" style="background:rgb(220,238,217)"></button>
      <button class="cswatch" id="color4" style="background:rgb(246,238,211)"></button>
      <button class="cswatch" id="color5" style="background:rgb(228,228,234)"></button>
    </div>
    <div class="opt-label">自定义色号</div>
    <div class="hex-row">
      <input id="colorinput" maxlength="7" placeholder="#RRGGBB" />
      <button id="colorapply">应用</button>
    </div>
    <div class="sheet-actions">
      <button id="colorcancel" class="btn-cancel">取消</button>
      <button id="colordone" class="btn-primary">完成</button>
    </div>
  </div>
</div>

<div id="aboutoverlay" class="overlay">
  <div class="sheet">
    <h2>关于 Grass</h2>
    <div class="about-row"><span>版本</span><span id="aboutver">2.01</span></div>
    <div class="about-row"><span>开发者</span><span>Turbo838</span></div>
    <a class="about-link" href="https://debaoguo.github.io/grass-privacy/" id="privacylink">隐私政策</a>
    <div class="sheet-actions">
      <button id="aboutclose" class="btn-primary">关闭</button>
    </div>
  </div>
</div>

<script>
/* ===== 热更新引导（支持 OTA 更新应用，无需重装） ===== */
var GRASS_VERSION = "2.03";
var GRASS_UPDATE_URL = "https://debaoguo.github.io/grass-privacy/grass/update.json"; // 公网热更新
function compareVersion(a, b) {
  var x = String(a).split("."), y = String(b).split(".");
  for (var i = 0; i < Math.max(x.length, y.length); i++) {
    var xi = parseInt(x[i] || "0", 10), yi = parseInt(y[i] || "0", 10);
    if (xi !== yi) return xi > yi ? 1 : -1;
  }
  return 0;
}
function effectiveVersion() {
  var v = GRASS_VERSION;
  try {
    var s = localStorage.getItem("grass_applied_ver");
    if (s && compareVersion(s, v) > 0) v = s;
  } catch (e) {}
  return v;
}
(function () {
  try {
    var o = JSON.parse(localStorage.getItem("grass_ota") || "null");
    if (o && o.html && o.version && compareVersion(o.version, effectiveVersion()) > 0) {
      try { localStorage.setItem("grass_applied_ver", String(o.version)); } catch (e) {}
      document.open(); document.write(o.html); document.close();
    }
  } catch (e) {}
})();

"use strict";
(function () {

  /* ================= 常量与持久化 ================= */
  var SAVE_KEY = "grass-state-v2";
  var NAME_KEY = "grass-pet-name";
  var POT_KEY = "grass-pot-color";
  var GOLD_KEY = "grass-golden";
  var OTA_KEY = "grass_ota";
  var MAX_HEALTH = 100;
  var DECAY_HOURS = 36;
  var WATERINGS_PER_GROWTH = 30;
  var MAX_GROWTH = 50;
  var HEALTH_PER_POUR = 8;
  var POUR_SECONDS = 0.7;
  var SWAY_THRESHOLD = 1.3;
  var STRESS_LIMIT = 60;
  var MIN_LEAVES = 3;
  var FLOOD_AT = 50;

  var POT_COLORS = [
    [248, 241, 230], [246, 217, 224], [217, 232, 246],
    [220, 238, 217], [246, 238, 211], [228, 228, 234]
  ];

  var now = function () { return Date.now(); };
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerpColor(c1, c2, t) {
    return "rgb(" + Math.round(c1[0] + (c2[0] - c1[0]) * t) + "," +
      Math.round(c1[1] + (c2[1] - c1[1]) * t) + "," +
      Math.round(c1[2] + (c2[2] - c1[2]) * t) + ")";
  }
  function shade(c, f) { return "rgb(" + Math.round(c[0] * f) + "," + Math.round(c[1] * f) + "," + Math.round(c[2] * f) + ")"; }
  function toHex(n) { var s = n.toString(16); return s.length < 2 ? "0" + s : s; }
  function hexToRgb(hex) {
    var h = (hex || "").replace(/^#/, "").trim();
    if (!/^[0-9a-fA-F]{6}$/.test(h)) return null;
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }

  var state = { bornAt: now(), health: MAX_HEALTH, waterings: 0, lastWatered: null, lastSeen: now() };
  var petName = "小草";
  var potColorIdx = 0, customColor = "";
  var goldenCan = false;

  function loadState() {
    var raw = null;
    try { raw = localStorage.getItem(SAVE_KEY); } catch (e) {}
    if (raw) {
      try {
        var s = JSON.parse(raw);
        var elapsedH = (now() - (s.lastSeen || now())) / 3600000;
        var decayed = (s.health == null ? MAX_HEALTH : s.health) - (elapsedH / DECAY_HOURS) * MAX_HEALTH;
        state.bornAt = s.bornAt || now();
        state.health = clamp(decayed, 0, MAX_HEALTH);
        state.waterings = s.waterings || 0;
        state.lastWatered = s.lastWatered || null;
        state.lastSeen = now();
      } catch (e) {}
    }
  }
  function loadName() { try { var n = localStorage.getItem(NAME_KEY); if (n && n.trim()) petName = n.trim(); } catch (e) {} }
  function loadPotColor() {
    try {
      var v = localStorage.getItem(POT_KEY);
      if (v) {
        var o = JSON.parse(v);
        potColorIdx = clamp(parseInt(o.idx, 10) || 0, 0, POT_COLORS.length - 1);
        customColor = typeof o.custom === "string" ? o.custom : "";
      }
    } catch (e) {}
  }
  function loadGolden() { try { goldenCan = localStorage.getItem(GOLD_KEY) === "1"; } catch (e) {} }
  function save() { state.lastSeen = now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {} }
  function saveName() { try { localStorage.setItem(NAME_KEY, petName); } catch (e) {} }
  function savePotColor() { try { localStorage.setItem(POT_KEY, JSON.stringify({ idx: potColorIdx, custom: customColor })); } catch (e) {} }
  function saveGolden() { try { localStorage.setItem(GOLD_KEY, goldenCan ? "1" : "0"); } catch (e) {} }

  loadState(); loadName(); loadPotColor(); loadGolden();

  /* ================= 画布 ================= */
  var canvas = document.getElementById("scene");
  var ctx = canvas.getContext("2d");
  var phoneEl = document.getElementById("phone");
  var dpr = Math.min(window.devicePixelRatio || 1, 3);
  var geo = { w: 0, h: 0, cx: 0, potW: 0, potH: 0, potBottom: 0, bodyTop: 0, soilY: 0, maxH: 0 };

  function resize() {
    var w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    geo.w = w; geo.h = h; geo.cx = w / 2;
    geo.potW = clamp(w * 0.52, 130, 220);
    geo.potH = clamp(h * 0.24, 70, 120);
    geo.potBottom = h - 4;
    geo.bodyTop = geo.potBottom - geo.potH + geo.potH * 0.14;
    geo.soilY = geo.bodyTop + 3;
    geo.maxH = h * 0.5;
    can.rx = w - CAN_W * 0.75; can.ry = h * 0.20;
    if (!can.dragging) { can.x = can.rx; can.y = can.ry; }
    initBlades();
  }
  if ("ResizeObserver" in window) {
    new ResizeObserver(resize).observe(canvas);
  } else {
    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", resize);
  }

  /* ================= 小草叶片 ================= */
  var BLADE_COUNT = 12;
  var blades = [];
  var growAnim = 0;
  var lastLevel = 0;
  var leafStress = 0;
  var fallenLeaves = [];
  function initBlades() {
    blades = [];
    for (var i = 0; i < BLADE_COUNT; i++) {
      var f = i / (BLADE_COUNT - 1);
      blades.push({
        nx: f * 2 - 1, hMul: 0.6 + Math.random() * 0.4, wMul: 0.85 + Math.random() * 0.35,
        ph: Math.random() * Math.PI * 2, stiff: 0.55 + Math.random() * 0.45,
        lean: (Math.random() - 0.5) * 0.4, sway: 0, vel: 0, fallen: false,
        baseX: geo.cx + (f * 2 - 1) * geo.potW * 0.34
      });
    }
    lastLevel = growthLevel();
  }
  function growthLevel() { return Math.min(MAX_GROWTH, Math.floor(state.waterings / WATERINGS_PER_GROWTH)); }
  function dryFactor() { return 1 - state.health / MAX_HEALTH; }
  function bladeHeight(b) {
    var h = geo.maxH * (0.18 + 0.82 * growAnim) * b.hMul;
    h *= 0.55 + 0.45 * (state.health / MAX_HEALTH);
    return h;
  }
  function aliveBlades() {

    ctx.fillStyle = "rgba(255,255,255,0.7)";
    for (var d = 0; d < 3; d++) { ctx.beginPath(); ctx.arc(-w / 2 - 21, h * 0.26 + d * 3.4, 1.3, 0, Math.PI * 2); ctx.fill(); }
    ctx.beginPath(); ctx.ellipse(-w * 0.18, -h * 0.16, w * 0.2, h * 0.16, -0.3, 0, Math.PI * 2); ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.fill();
    ctx.restore();
  }
  function roundRectPath(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function drawFlood() {
    var g = ctx.createLinearGradient(0, 0, 0, geo.h);
    g.addColorStop(0, "rgba(72,156,255,0.90)");
    g.addColorStop(0.5, "rgba(30,110,220,0.93)");
    g.addColorStop(1, "rgba(10,60,160,0.96)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, geo.w, geo.h);
  }

  function drawFlower() {
    if (growthLevel() < 40 || state.health < 65) return;
    var b = blades[Math.floor(blades.length * 0.6)];
    if (b.fallen) return;
    var h = bladeHeight(b);
    var tipX = b.baseX + b.sway * h * 0.5;
    var tipY = geo.soilY - h;
    var r = Math.max(4, h * 0.06);
    ctx.save();
    ctx.translate(tipX, tipY);
    ctx.rotate(b.sway * 0.4);
    ctx.fillStyle = "rgba(0,0,0,0.08)";
    ctx.beginPath(); ctx.ellipse(0, r * 0.55, r * 1.1, r * 0.8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#FFE3EC";
    for (var i = 0; i < 5; i++) {
      var a = (i / 5) * Math.PI * 2;
      ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r, r * 0.85, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "#FFC94D";
    ctx.beginPath(); ctx.arc(0, 0, r * 0.75, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawDew() {
    if (!dew) return;
    var k = 1 - (dew.until - performance.now()) / 5000;
    var alpha = k < 0.85 ? 1 : (1 - k) / 0.15;
    ctx.fillStyle = "rgba(140,200,255," + (0.75 * alpha).toFixed(3) + ")";
    for (var i = 0; i < dew.dots.length; i++) {
      var d = dew.dots[i];
      var b = d.blade;
      var h = bladeHeight(b);
      var x = b.baseX + b.sway * h * 0.5 * d.t;
      var y = geo.soilY - h * d.t;
      ctx.beginPath(); ctx.ellipse(x, y, 2.2, 1.6, 0.4, 0, Math.PI * 2); ctx.fill();
    }
  }
  function drawDroplet(d) {
    ctx.fillStyle = "rgba(90,190,255,0.85)";
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    ctx.beginPath(); ctx.arc(d.x - d.r * 0.3, d.y - d.r * 0.3, d.r * 0.35, 0, Math.PI * 2); ctx.fill();
  }
  function drawSplash(sp) {
    ctx.fillStyle = "rgba(90,190,255," + (sp.life * 0.7).toFixed(3) + ")";
    ctx.beginPath(); ctx.arc(sp.x, sp.y, 1.4, 0, Math.PI * 2); ctx.fill();
  }

  /* ================= UI ================= */
  var el = {
    healthfill: document.getElementById("healthfill"),
    healthnum: document.getElementById("healthnum"),
    statuschip: document.getElementById("statuschip"),
    lastwater: document.getElementById("lastwater"),
    daysval: document.getElementById("daysval")
  };
  function statusOf(health) {
    var r = health / MAX_HEALTH;
    if (r >= 0.9) return { text: "生机勃勃", cls: "good" };
    if (r >= 0.6) return { text: "状态良好", cls: "good" };
    if (r >= 0.35) return { text: "有点渴了", cls: "warn" };
    if (r >= 0.12) return { text: "干枯发黄", cls: "bad" };
    return { text: "快救救它", cls: "bad" };
  }
  function fmtAgo(ts) {
    if (!ts) return "还没有浇过水";
    var m = Math.floor((now() - ts) / 60000);
    if (m < 1) return "刚刚浇过水";
    if (m < 60) return m + " 分钟前浇水";
    var hh = Math.floor(m / 60);
    if (hh < 24) return hh + " 小时前浇水";
    return Math.floor(hh / 24) + " 天前浇水";
  }
  var uiLast = { hp: -1, tag: "", water: "", days: -1 };
  function updateUI() {
    var hp = Math.round(state.health);
    var st = statusOf(state.health);
    var wl = fmtAgo(state.lastWatered);
    var days = Math.floor((now() - state.bornAt) / 86400000) + 1;
    if (uiLast.hp !== hp) {
      uiLast.hp = hp;
      el.healthnum.textContent = hp + "%";
      el.healthfill.style.width = hp + "%";
      var dry = dryFactor();
      el.healthfill.style.background = "linear-gradient(90deg," +
        lerpColor([76, 175, 80], [232, 120, 52], dry) + "," +
        lerpColor([139, 195, 74], [198, 160, 84], dry) + ")";
    }
    if (uiLast.tag !== st.text) { uiLast.tag = st.text; el.statuschip.textContent = st.text; el.statuschip.className = "chip " + st.cls; }
    if (uiLast.water !== wl) { uiLast.water = wl; el.lastwater.textContent = wl; }
    if (uiLast.days !== days) { uiLast.days = days; el.daysval.textContent = days + " 天"; }
  }

  /* ================= 启动画面 ================= */
  var splash = document.getElementById("splash");
  var splashName = document.getElementById("splash-name");
  var titleEl = document.getElementById("title");
  function applyName() { splashName.textContent = petName; titleEl.textContent = petName; }
  applyName();
  setTimeout(function () { splash.classList.add("hide"); }, 1600);
  splash.addEventListener("pointerdown", function () { splash.classList.add("hide"); });

  /* ================= 隐私政策同意（首次启动，同意后才启用陀螺仪） ================= */
  var privacyOverlay = document.getElementById("privacyoverlay");
  var privacyAgreed = false;
  try { privacyAgreed = localStorage.getItem("grass-privacy-agreed") === "1"; } catch (e) {}
  if (privacyAgreed) {
    setupGyro();
  } else {
    privacyOverlay.classList.add("show");
  }
  document.getElementById("privacy-agree").addEventListener("click", function () {
    try { localStorage.setItem("grass-privacy-agreed", "1"); } catch (e) {}
    privacyOverlay.classList.remove("show");
    setupGyro();
  });
  document.getElementById("privacy-deny").addEventListener("click", function () {
    if (window.AndroidBridge && window.AndroidBridge.exitApp) {
      try { window.AndroidBridge.exitApp(); } catch (e) {}
    }
  });

  /* ================= 改名（双击大字） ================= */
  var editor = document.getElementById("editor");
  var nameInput = document.getElementById("nameinput");
  var lastTap = 0;
  titleEl.addEventListener("click", function () {
    var t = now();
    if (t - lastTap < 380) {
      lastTap = 0;
      nameInput.value = petName;
      editor.classList.add("show");
      try { nameInput.focus(); } catch (e) {}
    } else { lastTap = t; }
  });
  document.getElementById("namesave").addEventListener("click", function () {
    var v = nameInput.value.replace(/^\s+|\s+$/g, "");
    if (v) petName = v.slice(0, 12);
    saveName(); applyName(); editor.classList.remove("show");
  });
  document.getElementById("namecancel").addEventListener("click", function () { editor.classList.remove("show"); });

  /* ================= 花盆颜色（长按花盆） ================= */
  var colorOverlay = document.getElementById("coloroverlay");
  var colorInput = document.getElementById("colorinput");
  var savedColorIdx = 0, savedCustom = "";
  var colorBtns = [];
  for (var ci = 0; ci < POT_COLORS.length; ci++) {
    (function (idx) {
      var b = document.getElementById("color" + idx);
      b.addEventListener("click", function () { potColorIdx = idx; customColor = ""; refreshPicker(); });
      colorBtns.push(b);
    })(ci);
  }
  function refreshPicker() {
    for (var i = 0; i < colorBtns.length; i++) {
      if (!customColor && i === potColorIdx) colorBtns[i].classList.add("sel");
      else colorBtns[i].classList.remove("sel");
    }
    var c = currentColor();
    colorInput.value = "#" + toHex(c[0]) + toHex(c[1]) + toHex(c[2]);
  }
  document.getElementById("colorapply").addEventListener("click", function () {
    var c = hexToRgb(colorInput.value);
    if (c) { customColor = "#" + colorInput.value.replace(/^#/, "").toUpperCase(); refreshPicker(); }
    else { refreshPicker(); }
  });
  function enterColorMode() { potPressTimer = null; activePointer = null; showColorMode(); }
  function showColorMode() {
    savedColorIdx = potColorIdx; savedCustom = customColor;
    refreshPicker();
    colorOverlay.classList.add("show");
  }
  document.getElementById("colordone").addEventListener("click", function () {
    savePotColor();
    colorOverlay.classList.remove("show");
  });
  document.getElementById("colorcancel").addEventListener("click", function () {
    potColorIdx = savedColorIdx; customColor = savedCustom;
    colorOverlay.classList.remove("show");
  });

  /* ================= 关于 / 隐私政策 ================= */
  var aboutOverlay = document.getElementById("aboutoverlay");
  var aboutBtn = document.getElementById("aboutbtn");
  document.getElementById("aboutver").textContent = effectiveVersion();
  aboutBtn.addEventListener("click", function () { aboutOverlay.classList.add("show"); });
  document.getElementById("aboutclose").addEventListener("click", function () { aboutOverlay.classList.remove("show"); });

  /* ================= 热更新 ================= */
  function applyOTA(html) {
    if (!html) return;
    try { document.open(); document.write(html); document.close(); } catch (e) {}
  }
  function checkUpdate() {
    if (!GRASS_UPDATE_URL) return;
    try {
      fetch(GRASS_UPDATE_URL, { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (m) {
        if (m && m.version && m.url && compareVersion(String(m.version), effectiveVersion()) > 0) {
          return fetch(m.url, { cache: "no-store" }).then(function (r2) { return r2.text(); }).then(function (html) {
            try {
              localStorage.setItem(OTA_KEY, JSON.stringify({ version: m.version, html: html }));
              localStorage.setItem("grass_applied_ver", String(m.version));
            } catch (e) {}
            applyOTA(html);
          });
        }
      }).catch(function () {});
    } catch (e) {}
  }
  setTimeout(checkUpdate, 2500);

  /* ================= 生命周期 ================= */
  var saveTimer = null;
  function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 600); }
  setInterval(save, 5000);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      save();
    } else {
      var elapsedH = (now() - state.lastSeen) / 3600000;
      state.health = clamp(state.health - (elapsedH / DECAY_HOURS) * MAX_HEALTH, 0, MAX_HEALTH);
      state.lastSeen = now();
    }
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }

  var isStandalone = (window.navigator.standalone === true) || window.matchMedia("(display-mode: standalone)").matches;
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  var installBanner = document.getElementById("install");
  var installDismissed = false;
  try { installDismissed = localStorage.getItem("grass-install-dismissed") === "1"; } catch (e) {}
  if (isIOS && !isStandalone && !installDismissed) installBanner.classList.add("show");
  installBanner.querySelector(".x").addEventListener("click", function () {
    installBanner.classList.remove("show");
    try { localStorage.setItem("grass-install-dismissed", "1"); } catch (e) {}
  });

  /* ================= 启动 ================= */
  resize();
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
